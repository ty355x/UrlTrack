<h1 mat-dialog-title>
    {{ title }}
</h1>

<mat-dialog-content class="dialog-content">
    <div class="form">

        <div class="form-group">
            <label for="url">URL</label>
            <input id="url" type="text" class="control" [(ngModel)]="url.url" [disabled]="isSaving">
            <span class="error">{{ getError('url') }}</span>
        </div>

        <div class="form-group">
            <label for="update_method">Update Method</label>
            <select id="update_method" class="control" [(ngModel)]="url.update_method" [disabled]="isSaving">
                <option *ngFor="let method of updateMethods" [value]="method.value" [selected]="url.update_method === method.value">
                    {{ method.label }}
                </option>
            </select>
            <span class="error">{{ getError('update_method') }}</span>
        </div>

        <div *ngIf="url.update_method === 'time'" class="form-group">
            <label for="update_time">Update Time (EST)</label>
            <input id="update_time" type="text" class="control" [(ngModel)]="url.update_time" [ngxTimepicker]="updateTimePicker" [disabled]="isSaving">
            <ngx-material-timepicker #updateTimePicker></ngx-material-timepicker>
            <span class="error">{{ getError('update_time') }}</span>
        </div>

        <div *ngIf="url.update_method === 'interval'" class="form-group">
            <div class="update-interval-pane mr-5">
                <label for="update_interval_hours">Update Interval (Hours)</label>
                <input id="update_interval_hours" type="text" class="control" [(ngModel)]="url.update_interval_hours" [disabled]="isSaving" maxlength="2">
            </div>
            <div class="update-interval-pane">
                <label for="update_interval_mins">Update Interval (Minutes)</label>
                <input id="update_interval_mins" type="text" class="control" [(ngModel)]="url.update_interval_mins" [disabled]="isSaving" maxlength="3">
            </div>
            <div class="clearfix"></div>
            <span class="error">{{ getError('update_interval_hours') }}</span>
            <span class="error">{{ getError('update_interval_mins') }}</span>
        </div>

        <div class="form-group mb-sm">
            <input id="is_disabled" type="checkbox" class="checkbox" [(ngModel)]="url.is_disabled" [disabled]="isSaving">
            <label class="checklabel" for="is_disabled">Disabled</label>
        </div>

    </div>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
    <button class="button" (click)="save()">Save</button>
    <button class="button" mat-dialog-close>Close</button>
</mat-dialog-actions>
