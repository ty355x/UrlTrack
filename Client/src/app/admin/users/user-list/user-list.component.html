<div class="toolbar">
    <button (click)="addUser()" [disabled]="isLoading">
        <mat-icon class="icon">add_box</mat-icon>
        Add User
    </button>
</div>

<h1>Users</h1>
<app-loading [show]="isLoading && users === null"></app-loading>

<table *ngIf="users !== null" class="data-table">
    <tr>
        <th style="width: 20%">Email</th>
        <th style="width: 20%">Role</th>
        <th style="width: 20%">Enabled</th>
        <th style="width: 20%">Created</th>
        <th style="width: 20%"></th>
    </tr>
    <tr *ngFor="let user of users">
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>
            <span *ngIf="user.is_disabled">
                <mat-icon class="icon fail">cancel</mat-icon>Disabled
            </span>
            <span *ngIf="!user.is_disabled">
                <mat-icon class="icon success">check_circle</mat-icon>Enabled
            </span>
        </td>
        <td>{{ user.created_at | dateTime }}</td>
        <td class="actions-menu">
            <app-menu-dropdown>
                <li>
                    <button (click)="editUser(user)"><mat-icon class="icon">mode_edit</mat-icon>Edit</button>
                </li>
                <li>
                    <button (click)="deleteUser(user)"><mat-icon class="icon">delete</mat-icon>Delete</button>
                </li>
            </app-menu-dropdown>
        </td>
    </tr>
    <tr *ngIf="users.length === 0">
        <td colspan="5">No users found</td>
    </tr>
</table>
